function setRoute(route) {
  currentRoute = route;
  document.getElementById("routeEast").classList.toggle("active", route === "east");
  document.getElementById("routeWest").classList.toggle("active", route === "west");
  document.getElementById("routeIchitsugi").classList.toggle("active", route === "ichitsugi");
  render();
}

function setDay(day) {
  currentDay = day;
  document.getElementById("weekdayBtn").classList.toggle("active", day === "weekday");
  document.getElementById("holidayBtn").classList.toggle("active", day === "holiday");
  render();
}

function setDirection(direction) {
  currentDirection = direction;
  document.getElementById("upButton").classList.toggle("active", direction === "up");
  document.getElementById("downButton").classList.toggle("active", direction === "down");
  render();
}

function render() {
  let nextBusFound = false;
  const now = new Date();
  const currentMinutes = now.getHours() * 60 + now.getMinutes();
  const routeData = data[currentRoute];
  const obj = routeData && routeData[currentDay] && routeData[currentDay][currentDirection];

  if (!obj) {
    document.getElementById("title").textContent = "一ツ木線";
    document.getElementById("tableArea").innerHTML = '<div class="info">時刻表データを順次追加中です</div>';
    return;
  }

  let html = "<table><tr><th>便</th>";
  obj.stops.forEach(stop => html += `<th>${stop}</th>`);
  html += "</tr>";

  obj.times.forEach((row, index) => {
    html += `<tr><td class="stop">${index + 1}便</td>`;
    row.forEach(time => {
      let className = "";
      if (time !== "-") {
        const [hour, minute] = time.split(":").map(Number);
        const busMinutes = hour * 60 + minute;
        if (!nextBusFound && busMinutes >= currentMinutes) {
          className = "nextBus";
          nextBusFound = true;
        }
      }
      html += `<td class="${className}">${time}</td>`;
    });
    html += "</tr>";
  });

  html += "</table>";
  document.getElementById("tableArea").innerHTML = html;

  const routeName = currentRoute === "east" ? "東境線" : currentRoute === "west" ? "西境線" : "一ツ木線";
  const dayName = currentDay === "weekday" ? "平日" : "土日祝";
  const directionName = currentDirection === "up" ? "上り" : "下り";
  document.getElementById("title").innerText =
    `${routeName} ${dayName} ${directionName}`;
}

setRoute(currentRoute);
setDay(currentDay);
setDirection(currentDirection);
render();
</script>
